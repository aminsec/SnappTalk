<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="duneSky" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E1F"/>
      <stop offset="0.4" stop-color="#1A2440"/>
      <stop offset="0.7" stop-color="#3A2E4E"/>
      <stop offset="1" stop-color="#5A3A3A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1500 220) scale(380 380)">
      <stop stop-color="#FFF6E0" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#FFE0A0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFE0A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneFar" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3A5A"/>
      <stop offset="1" stop-color="#2A2038"/>
    </linearGradient>
    <linearGradient id="duneMid" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A4A4A"/>
      <stop offset="1" stop-color="#3A2A38"/>
    </linearGradient>
    <linearGradient id="duneNear" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A5A4A"/>
      <stop offset="1" stop-color="#4A2A30"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A3A38"/>
      <stop offset="1" stop-color="#1A1420"/>
    </linearGradient>
    <filter id="moonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#duneSky)"/>

  <!-- Moon glow -->
  <rect width="1920" height="1080" fill="url(#moonGlow)"/>

  <!-- Moon -->
  <circle cx="1500" cy="220" r="70" fill="#FFF6E0"/>
  <circle cx="1500" cy="220" r="95" fill="#FFE0A0" opacity="0.25" filter="url(#moonBlur)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="180" cy="120" r="1.5" opacity="0.8"/>
    <circle cx="360" cy="200" r="1" opacity="0.5"/>
    <circle cx="540" cy="90" r="1.3" opacity="0.7"/>
    <circle cx="720" cy="180" r="1" opacity="0.5"/>
    <circle cx="900" cy="110" r="1.4" opacity="0.75"/>
    <circle cx="1080" cy="200" r="1" opacity="0.5"/>
    <circle cx="1260" cy="90" r="1.2" opacity="0.65"/>
    <circle cx="1740" cy="140" r="1.3" opacity="0.7"/>
    <circle cx="1880" cy="220" r="1" opacity="0.5"/>
    <circle cx="300" cy="320" r="1" opacity="0.4"/>
    <circle cx="820" cy="300" r="0.9" opacity="0.4"/>
    <circle cx="1180" cy="320" r="1" opacity="0.45"/>
  </g>

  <!-- Layered dunes -->
  <path d="M0 640C240 600 460 660 700 620C940 580 1180 660 1420 620C1660 580 1820 630 1920 610V1080H0V640Z" fill="url(#duneFar)"/>
  <path d="M0 720C260 680 500 740 760 700C1020 660 1280 740 1540 700C1720 670 1840 710 1920 690V1080H0V720Z" fill="url(#duneMid)"/>
  <path d="M0 810C280 770 540 830 820 790C1100 750 1380 830 1660 790C1800 770 1880 800 1920 790V1080H0V810Z" fill="url(#duneNear)"/>
  <path d="M0 900C300 860 600 920 900 880C1200 840 1500 920 1800 880C1880 870 1900 885 1920 880V1080H0V900Z" fill="url(#duneFront)"/>

  <!-- Dune ridge highlights -->
  <g stroke="#FFE0A0" stroke-width="2" fill="none" opacity="0.25">
    <path d="M0 640C240 600 460 660 700 620C940 580 1180 660 1420 620C1660 580 1820 630 1920 610"/>
    <path d="M0 720C260 680 500 740 760 700C1020 660 1280 740 1540 700C1720 670 1840 710 1920 690"/>
  </g>
</svg>
