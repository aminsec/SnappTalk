<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020208"/>
      <stop offset="0.5" stop-color="#0A0618"/>
      <stop offset="1" stop-color="#04020C"/>
    </linearGradient>
    <radialGradient id="nebulaPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 420) scale(520 420)">
      <stop stop-color="#FF4D9D" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FF4D9D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF4D9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1350 620) scale(560 460)">
      <stop stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 300) scale(420 340)">
      <stop stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 520) scale(300 300)">
      <stop stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#C4B5FD" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="nebulaBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Deep space -->
  <rect width="1920" height="1080" fill="url(#space)"/>

  <!-- Nebula clouds -->
  <g filter="url(#nebulaBlur)">
    <rect width="1920" height="1080" fill="url(#nebulaPink)"/>
    <rect width="1920" height="1080" fill="url(#nebulaPurple)"/>
    <rect width="1920" height="1080" fill="url(#nebulaBlue)"/>
    <rect width="1920" height="1080" fill="url(#coreGlow)"/>
  </g>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="120" r="1.6" opacity="0.9"/>
    <circle cx="300" cy="260" r="1.1" opacity="0.6"/>
    <circle cx="460" cy="90" r="1.4" opacity="0.8"/>
    <circle cx="620" cy="200" r="1" opacity="0.5"/>
    <circle cx="780" cy="140" r="1.7" opacity="0.85"/>
    <circle cx="940" cy="80" r="1.2" opacity="0.6"/>
    <circle cx="1100" cy="220" r="1.5" opacity="0.8"/>
    <circle cx="1260" cy="120" r="1" opacity="0.5"/>
    <circle cx="1420" cy="260" r="1.3" opacity="0.7"/>
    <circle cx="1580" cy="100" r="1.1" opacity="0.55"/>
    <circle cx="1740" cy="200" r="1.4" opacity="0.75"/>
    <circle cx="1880" cy="120" r="1" opacity="0.5"/>
    <circle cx="220" cy="420" r="1" opacity="0.4"/>
    <circle cx="520" cy="380" r="1.2" opacity="0.5"/>
    <circle cx="820" cy="460" r="0.9" opacity="0.4"/>
    <circle cx="1180" cy="400" r="1.1" opacity="0.45"/>
    <circle cx="1520" cy="440" r="0.9" opacity="0.4"/>
    <circle cx="1780" cy="380" r="1.2" opacity="0.5"/>
    <circle cx="380" cy="700" r="1" opacity="0.35"/>
    <circle cx="700" cy="820" r="0.9" opacity="0.35"/>
    <circle cx="1040" cy="760" r="1" opacity="0.4"/>
    <circle cx="1360" cy="840" r="0.9" opacity="0.35"/>
    <circle cx="1660" cy="720" r="1.1" opacity="0.4"/>
    <circle cx="1900" cy="860" r="0.9" opacity="0.35"/>
  </g>

  <!-- Bright featured stars -->
  <g>
    <circle cx="300" cy="260" r="2.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="300" cy="260" r="6" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="1420" cy="260" r="2.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="1420" cy="260" r="5" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="940" cy="80" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="940" cy="80" r="5" fill="#FFFFFF" opacity="0.2"/>
  </g>
</svg>
